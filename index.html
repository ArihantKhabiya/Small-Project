<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Design</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <!-- NAVBAR -->
        <div class="navbar">

            <!-- LOGO -->
            <div class="icon">
                <h2 class="logo">Arihant</h2>
            </div>

            <!-- MENU -->
            <div class="menu">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Design</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>

            <!-- SEARCH -->
            <div class="search">
                <input
                    class="srch"
                    type="search"
                    name=""
                    placeholder="Type To text"
                >

                <a href="#">
                    <button class="btn">Search</button>
                </a>
            </div>

        </div>


        <!-- CONTENT -->
        <div class="content">

            <h1>
                Web Design & <br>
                <span>Development</span>
            </h1>

            <p class="paragraph">
                Full Stack Developer | Web Designer | Backend Developer | Frontend Developer
            </p>

            <button class="cn">
                <a href="#">Join Now</a>
            </button>

        </div>


        <!-- LOGIN FORM -->
        <div class="form">

            <h2>Log In</h2>

            <input
                type="email"
                name="email"
                placeholder="Enter Email Here"
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password Here"
            >

            <button class="btnn">
                <a href="#">Login</a>
            </button>

            

            <a href="#">
                <p class="liw">Sign Up Here</p>
            </a>

        </div>

    </div>

</body>

</html>
